<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Clearance: a hands-first mixed-reality puzzle. Tiny robots plan. Nothing moves without your clearance." />
    <title>Clearance</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%2358f0a0%27/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --ink: #eef1f4; --muted: #9aa3ad; --go: #3fb950; --panel: rgba(20, 24, 30, 0.9); --line: #2c333d; }
      html, body { margin: 0; height: 100%; background: #14181e; color: var(--ink); font-family: system-ui, sans-serif; }
      #scene { position: fixed; inset: 0; }
      .card { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(92vw, 520px); box-sizing: border-box;
              background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px 24px 20px; text-align: center; }
      body.playing .card { opacity: 0; pointer-events: none; transition: opacity 0.35s; }
      h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 0.02em; }
      .tag { margin: 0 0 18px; color: var(--muted); }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button { font: 600 18px system-ui, sans-serif; padding: 15px 22px; border: 0; border-radius: 999px; cursor: pointer; min-width: 200px; }
      .primary { background: var(--go); color: #08110a; }
      .secondary { background: #262d36; color: var(--ink); border: 1px solid #3a434e; }
      button:disabled { background: #3a414b; color: var(--muted); cursor: wait; }
      .meta { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
      #share { display: none; }
      body.result #share { display: block; }
      body.result #intro { display: none; }
      pre { text-align: left; background: #0f1318; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 14px 0; white-space: pre-wrap; font: 15px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div class="card" id="intro">
      <h1>Clearance</h1>
      <p class="tag">Tiny robots plan. Nothing moves without your clearance.</p>
      <div class="row">
        <button id="start" class="primary" disabled>Loading…</button>
        <button id="daily" class="secondary" disabled>Daily Shift</button>
        <button id="overtime" class="secondary" disabled>Overtime</button>
      </div>
      <p class="meta" id="status">Hands only. Seated. About 10 minutes.</p>
    </div>
    <div class="card" id="share">
      <h1>Daily Shift</h1>
      <pre id="shareText"></pre>
      <div class="row">
        <button id="copy" class="primary">Copy result</button>
        <button id="again" class="secondary">Back</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
