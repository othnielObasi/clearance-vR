<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Clearance: a hands-first mixed-reality puzzle. Tiny robots plan. Nothing moves without your clearance." />
    <title>Clearance</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%2358f0a0%27/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14181e; color: #eef1f4; font-family: system-ui, sans-serif; }
      #scene { position: fixed; inset: 0; }
      #intro { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: min(92vw, 520px); text-align: center;
               background: rgba(20, 24, 30, 0.88); border-radius: 20px; padding: 24px 24px 20px; box-sizing: border-box; }
      body.playing #intro { opacity: 0.0; pointer-events: none; transition: opacity 0.4s; }
      h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 0.02em; }
      .tag { margin: 0 0 18px; color: #9aa3ad; }
      button { font: 600 20px system-ui, sans-serif; padding: 16px 28px; border: 0; border-radius: 999px; background: #3fb950; color: #08110a; cursor: pointer; min-width: 240px; }
      button:disabled { background: #3a414b; color: #9aa3ad; cursor: wait; }
      #status { margin: 14px 0 0; font-size: 15px; color: #9aa3ad; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="intro">
      <h1>Clearance</h1>
      <p class="tag">Tiny robots plan. Nothing moves without your clearance.</p>
      <button id="start" disabled>Loading…</button>
      <p id="status">Hands only. Seated. About 10 minutes.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
